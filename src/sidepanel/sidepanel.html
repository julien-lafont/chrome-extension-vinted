<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vinted Smart Bookmarks</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-row">
        <h1>Vinted Smart Bookmarks</h1>
        <span class="count" id="count">0</span>
      </div>

      <nav class="collections" id="collections" aria-label="Collections">
        <!-- Onglets injectés par sidepanel.js -->
      </nav>

      <input
        type="search"
        id="search"
        class="search"
        placeholder="Filtrer par titre, marque, taille…"
        autocomplete="off"
      />

      <div class="sortbar">
        <label class="sr-only" for="sort">Trier par</label>
        <select id="sort" class="select"></select>
        <button type="button" id="sort-dir" class="dir" title="Inverser le sens du tri">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 4v16m0 0l-3-3m3 3l3-3M17 20V4m0 0l-3 3m3-3l3 3" />
          </svg>
          <span id="sort-dir-label">Croissant</span>
        </button>
        <button
          type="button"
          id="open-all"
          class="dir"
          title="Ouvrir tous les articles affichés dans de nouveaux onglets"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" />
            <path d="M15 3h6v6" />
            <path d="M10 14L21 3" />
          </svg>
          <span id="open-all-label">Tout ouvrir</span>
        </button>
        <button type="button" id="refresh" class="dir" title="Rafraîchir">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
          <span id="refresh-label">Rafraîchir</span>
        </button>
      </div>

      <p class="hint" id="hint" hidden></p>
      <p class="hint watchbar" id="watchbar" hidden></p>
      <p class="hint" id="watch-notice" hidden></p>
    </header>

    <main id="list" class="list" aria-live="polite"></main>

    <template id="item-template">
      <article class="item">
        <button
          type="button"
          class="item-drag"
          title="Glisser pour réorganiser"
          aria-label="Réorganiser"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="6" r="1.6" />
            <circle cx="15" cy="6" r="1.6" />
            <circle cx="9" cy="12" r="1.6" />
            <circle cx="15" cy="12" r="1.6" />
            <circle cx="9" cy="18" r="1.6" />
            <circle cx="15" cy="18" r="1.6" />
          </svg>
        </button>

        <!-- Un bouton, pas un lien : le clic ouvre la visionneuse. Il retombe
             sur l'onglet Vinted pour les articles dont la fiche n'a pas été lue,
             qui n'ont pas de galerie — le titre reste le lien de plein droit. -->
        <button type="button" class="item-thumb">
          <img alt="" loading="lazy" draggable="false" />
          <span class="item-photo-count" hidden></span>
        </button>

        <div class="item-body">
          <a class="item-title" target="_blank" rel="noreferrer"></a>
          <p class="item-meta"></p>

          <!-- Où l'article est classé, quand ce n'est pas l'onglet affiché :
               c'est ce qui permet de balayer « Mes favoris » — qui montre tout —
               en voyant d'un coup d'œil ce qui est déjà rangé. Un bouton, il
               ouvre la collection. Masqué pour un article non classé : l'absence
               de pastille *est* l'information. -->
          <p class="item-where" hidden>
            <button type="button" class="item-collection">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                />
              </svg>
              <span class="item-collection-name"></span>
            </button>
          </p>

          <p class="item-price">
            <span class="item-price-value"></span>
            <s class="item-price-was" hidden></s>
            <button type="button" class="item-price-delta" hidden></button>
            <span class="item-status-badge" hidden></span>
            <!-- Offre en cours (docs/specs/offres.md §5). Un bouton : il ouvre la
                 conversation d'où l'offre vient. Son ancienneté est recalculée
                 toutes les 5 min à partir de `data-offer-at`, sans rendu. -->
            <button type="button" class="item-offer" hidden></button>
          </p>

          <!-- Le vendeur a sa propre ligne : sur une pièce rare, il compte
               autant que l'article, et les quatre informations (pays, pseudo,
               note, évaluations) ne tiennent pas sur la ligne du prix sans en
               chasser le prix lui-même. Masquée tant que la fiche n'a pas été
               lue. -->
          <p class="item-seller-line" hidden>
            <span class="item-seller-flag" hidden></span>
            <a class="item-seller" target="_blank" rel="noreferrer"></a>
            <span class="item-seller-rating" hidden></span>
            <span class="item-seller-reviews" hidden></span>
          </p>
        </div>

        <div class="item-actions">
          <button
            type="button"
            class="icon-btn item-similar"
            title="Rechercher un article similaire"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
          </button>
          <button type="button" class="icon-btn item-elsewhere">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <!-- Cadre de visée + cible : le vocabulaire de la recherche par
                   image, distinct de la loupe du bouton « similaires ». -->
              <path d="M3 8V5a2 2 0 0 1 2-2h3" />
              <path d="M16 3h3a2 2 0 0 1 2 2v3" />
              <path d="M21 16v3a2 2 0 0 1-2 2h-3" />
              <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
              <circle cx="12" cy="12" r="3.2" />
            </svg>
          </button>
          <button type="button" class="icon-btn item-move" title="Déplacer vers une collection">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            </svg>
          </button>
          <button type="button" class="icon-btn item-remove" title="Retirer de mes favoris">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6"
              />
            </svg>
          </button>
        </div>
      </article>
    </template>

    <!-- Menu « déplacer vers », ancré sous le bouton dossier d'un article -->
    <div id="move-menu" class="menu" hidden></div>

    <!-- Popover d'historique de prix, ancré sous la pastille de variation -->
    <div id="price-history" class="menu" hidden></div>

    <!-- Modale : création / renommage de collection -->
    <div id="collection-dialog" class="overlay" hidden>
      <form class="dialog" id="collection-form">
        <h2 id="collection-dialog-title">Nouvelle collection</h2>
        <input
          type="text"
          id="collection-name"
          class="input"
          maxlength="40"
          placeholder="Jeans, Chemises, Cadeau Julien…"
          autocomplete="off"
          required
        />
        <div class="dialog-actions">
          <button type="button" class="ghost" data-close>Annuler</button>
          <button type="submit" class="primary" id="collection-submit">Créer</button>
        </div>
      </form>
    </div>

    <!-- Visionneuse : toutes les photos de la fiche, sans quitter le panneau -->
    <div id="gallery-dialog" class="overlay" hidden>
      <div class="gallery" role="dialog" aria-modal="true" aria-label="Photos de l'article">
        <div class="gallery-head">
          <p class="gallery-title" id="gallery-title"></p>
          <button type="button" class="icon-btn" data-close title="Fermer" aria-label="Fermer">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>

        <div class="gallery-stage" id="gallery-stage">
          <img id="gallery-image" alt="" draggable="false" />

          <button
            type="button"
            class="gallery-nav gallery-prev"
            id="gallery-prev"
            title="Photo précédente"
            aria-label="Photo précédente"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>

          <button
            type="button"
            class="gallery-nav gallery-next"
            id="gallery-next"
            title="Photo suivante"
            aria-label="Photo suivante"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 5l7 7-7 7" />
            </svg>
          </button>

          <!-- Lien, pas un bouton : ouvre la pleine résolution dans un nouvel
               onglet du navigateur, hors du panneau — pas d'action JS à câbler,
               le même schéma que #gallery-link. -->
          <a
            id="gallery-zoom"
            class="gallery-zoom"
            target="_blank"
            rel="noreferrer"
            title="Ouvrir la photo en taille maximale"
            aria-label="Ouvrir la photo en taille maximale"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>
          </a>
        </div>

        <div class="gallery-thumbs" id="gallery-thumbs"></div>

        <p class="gallery-foot">
          <span id="gallery-counter"></span>
          <span class="gallery-foot-links">
            <a id="gallery-elsewhere" target="_blank" rel="noreferrer">Chercher cette photo</a>
            <a id="gallery-link" target="_blank" rel="noreferrer">Ouvrir sur Vinted</a>
          </span>
        </p>
      </div>
    </div>

    <!-- Modale : articles écartés un par un. Séparée des filtres, dont elle
         occupait la moitié de la hauteur pour un usage bien plus rare.

         `overlay--stacked` : elle s'ouvre **par-dessus** #filters-dialog, donc
         pendant qu'il est visible. Les deux sont des `.overlay` de même z-index
         (80) ; sans ce modificateur, l'ordre du DOM les départage et
         #filters-dialog — plus loin dans la page — peint par-dessus, rendant
         "Gérer" muet en apparence alors que la modale s'ouvre bien. -->
    <div id="hidden-dialog" class="overlay overlay--stacked" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="hidden-title">
        <h2 id="hidden-title">Articles écartés</h2>

        <p class="filters-line" id="hidden-summary"></p>
        <div class="filters-recent" id="hidden-recent"></div>
        <p class="hint filters-note" id="hidden-note"></p>

        <div class="dialog-actions">
          <button type="button" class="primary" data-close>Fermer</button>
        </div>
      </div>
    </div>

    <!-- Modale : filtres du catalogue -->
    <div id="filters-dialog" class="overlay" hidden>
      <div class="dialog dialog-lg" role="dialog" aria-modal="true" aria-labelledby="filters-title">
        <h2 id="filters-title">Filtres du catalogue</h2>

        <!-- Une ligne, pas une section : la liste des écartés est longue et
             consultée rarement, elle a sa propre modale (#hidden-dialog). -->
        <section class="filters-section">
          <h3>Articles écartés</h3>
          <p class="filters-line" id="filters-hidden"></p>
        </section>

        <section class="filters-section">
          <h3>Marques masquées <span class="filters-count" id="filters-brands-count"></span></h3>
          <div class="chips chips--wrap" id="filters-brands"></div>
          <form class="filters-add" id="filters-brand-form">
            <input
              type="text"
              class="input"
              id="filters-brand-input"
              maxlength="40"
              placeholder="Ajouter une marque…"
              autocomplete="off"
            />
            <button type="submit" class="ghost">Ajouter</button>
          </form>
          <button type="button" class="link" id="filters-fast-fashion">
            + Ajouter le jeu « fast fashion »
          </button>
        </section>

        <section class="filters-section">
          <h3>Vendeurs masqués <span class="filters-count" id="filters-sellers-count"></span></h3>
          <div class="chips chips--wrap" id="filters-sellers"></div>
          <!-- Pas de champ d'ajout : un vendeur s'identifie par un nombre, jamais
               par un pseudo saisi à la main. Ils n'entrent dans la liste que
               depuis une page Vinted, où l'identifiant est connu. -->
        </section>

        <section class="filters-section">
          <h3>Mots exclus <span class="filters-count" id="filters-words-count"></span></h3>
          <div class="chips chips--wrap" id="filters-words"></div>
          <form class="filters-add" id="filters-word-form">
            <input
              type="text"
              class="input"
              id="filters-word-input"
              maxlength="40"
              placeholder="Ajouter un mot…"
              autocomplete="off"
            />
            <button type="submit" class="ghost">Ajouter</button>
          </form>
        </section>

        <label class="check">
          <input type="checkbox" id="filters-reveal" />
          <span>Afficher les articles masqués (grisés au lieu d'être retirés)</span>
        </label>

        <p class="status-note" id="filters-status" hidden></p>

        <div class="dialog-actions">
          <button type="button" class="primary" data-close>Fermer</button>
        </div>
      </div>
    </div>

    <!-- Bande des réglages : permanente, et prévue pour accueillir d'autres
         boutons (import, coût total, cadence du suivi). -->
    <footer class="footer">
      <!-- aria-pressed reflète hasActiveRules() : pas un compte, juste « au moins
           une règle générale (marque, mot ou vendeur) est active ». Les articles
           écartés un par un ne l'allument pas — voir filters.ts. -->
      <button type="button" id="filters" class="ghost ghost-auto" aria-pressed="false">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 5h18M6 12h12M10 19h4" />
        </svg>
        <span>Filtres Vinted</span>
      </button>

      <!-- Bascule directe, sans modale : masquer les pubs n'a rien à régler, juste
           à être activé ou non. Désactivé par défaut — voir shared/types.ts,
           Settings.hideAds. -->
      <button
        type="button"
        id="hide-ads"
        class="ghost ghost-auto"
        aria-pressed="false"
        title="Masquer les encarts publicitaires du fil (désactivé par défaut)"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
        </svg>
        <span>Masquer les pubs</span>
      </button>

      <!-- Le seul réglage qui fasse *écrire* l'extension sur le compte Vinted :
           tant qu'il est éteint, rien ne part vers le site. Désactivé par
           défaut — voir shared/types.ts, Settings.favSync, et
           docs/specs/favoris-sync.md. -->
      <button
        type="button"
        id="fav-sync"
        class="ghost ghost-auto"
        aria-pressed="false"
        title="Lier les favoris de l'extension au cœur de Vinted (désactivé par défaut) — clic droit : rattrapage ponctuel"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 20.3 4.6 13a4.7 4.7 0 0 1 6.6-6.7l.8.8.8-.8A4.7 4.7 0 0 1 19.4 13z" />
          <path d="M9 12.2l2 2 4-4" />
        </svg>
        <span>Sync favoris</span>
      </button>
    </footer>

    <!-- Bande de développement : outils de mise au point, vouée à disparaître de
         la version publiée. Masquée par défaut — elle ne se déplie que par le
         clic droit sur l'icône de l'extension, « Ouvrir en mode développeur »
         (src/background/dev-menu.ts). Elle se retire en supprimant ce seul
         <footer> et son bloc `.footer--dev` dans sidepanel.css — ne pas la
         refusionner avec la bande de réglages ci-dessus, c'est tout l'intérêt de
         la séparation. -->
    <footer class="footer footer--dev" id="dev-bar" hidden>
      <button type="button" id="export" class="ghost">Exporter en JSON</button>
      <button type="button" id="diagnose" class="ghost">Diagnostic</button>
      <button
        type="button"
        id="reset-rate"
        class="ghost"
        title="Seau à jetons, budget du jour et fenêtre de silence après un 429"
      >
        Débloquer le débit
      </button>
      <button
        type="button"
        id="dev-exit"
        class="ghost"
        title="Replier la bande de développement (elle revient par le clic droit sur l'icône de l'extension)"
      >
        Quitter
      </button>
    </footer>

    <div id="report" class="report" hidden></div>

    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
